# User-supplied LiteLLM aliases. Capabilities declare canonical GPT compatibility;
# verify your gateway actually preserves these capabilities before production use.
[classifier]
checkpoint = "convaiinnovations/laya"
confidence_threshold = 0.70
token_budget = 2048

[routes.general]
model = "gpt-5.6-luna"
effort = "medium"

[routes.coding]
model = "gpt-5.6-sol"
description = "Implement features, refactor code, write tests"
effort = "medium"

[routes.debugging]
model = "gpt-5.6-sol"
description = "Diagnose failures and correct defects"
effort = "high"

[routes.research]
model = "gpt-5.6-terra"
description = "Investigate, compare, design architecture, plan, or review"
effort = "high"

[routes.writing]
description = "Write documentation, explanations, or edit prose"
effort = "low"

[models."gpt-5.6-luna"]
canonical_model = "gpt-5.6-luna"
context_window = 272000
input_modalities = ["text", "image"]
supports_tools = true
reasoning_efforts = ["low", "medium", "high"]

[models."gpt-5.6-terra"]
canonical_model = "gpt-5.6-terra"
context_window = 272000
input_modalities = ["text", "image"]
supports_tools = true
reasoning_efforts = ["low", "medium", "high"]

[models."gpt-5.6-sol"]
canonical_model = "gpt-5.6-sol"
context_window = 272000
input_modalities = ["text", "image"]
supports_tools = true
reasoning_efforts = ["low", "medium", "high"]
